<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Fruitly</title>
<meta name="description" content="Sign in to Fruitly or create your account.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fruitly.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<style>
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field input {
    height: 52px; padding: 0 20px;
    border-radius: var(--r-input); border: 1px solid rgba(19, 42, 29, 0.14);
    background: #fff; font: 400 16px/1 var(--sans);
  }
  .field input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .authtabs { display: flex; gap: 10px; }
  .autherr { color: #B3330E; font: 500 14px/1.4 var(--sans); min-height: 20px; margin: 0; }
</style>
</head>
<body>

<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:min(440px,100%);display:flex;flex-direction:column;gap:28px">
    <a href="index.html" style="display:flex;align-items:center;gap:12px;justify-content:center;color:var(--ink)">
      <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><path d="M58 7C75 12 87 31 87 51C87 73 68 92 45 92C25 92 10 78 10 59C10 46 18 37 29 28C39 20 44 3 58 7Z" fill="#157A3E"/><path d="M58 7C75 12 87 31 87 51C87 73 68 92 45 92C25 92 10 78 10 59C10 46 18 37 29 28C39 20 44 3 58 7Z" fill="#FFC233" transform="translate(23 15) scale(0.585)"/><path d="M56 9C60 2 69 0 76 3C74 11 65 15 56 9Z" fill="#A8C64D"/></svg>
      <span class="wordmark wordmark--xl">Fruitly</span>
    </a>

    <div class="card" style="padding:var(--card-pad);display:flex;flex-direction:column;gap:22px">
      <div class="authtabs" role="tablist" aria-label="Sign in or create account">
        <button class="chip is-on" type="button" role="tab" aria-selected="true" id="tab-signin">Sign in</button>
        <button class="chip" type="button" role="tab" aria-selected="false" id="tab-signup">Create account</button>
      </div>

      <form id="auth-form" style="display:flex;flex-direction:column;gap:16px" novalidate>
        <div class="field" id="name-field" hidden>
          <label class="small muted" for="f-name">Your name</label>
          <input id="f-name" type="text" autocomplete="name" maxlength="80" placeholder="Asha Rao">
        </div>
        <div class="field">
          <label class="small muted" for="f-email">Email</label>
          <input id="f-email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label class="small muted" for="f-password">Password</label>
          <input id="f-password" type="password" autocomplete="current-password" required minlength="8" placeholder="8+ characters">
        </div>
        <p class="autherr" id="auth-error" role="alert"></p>
        <button class="btn btn--green btn--block" type="submit" id="auth-submit">Sign in</button>
      </form>

      <p class="small muted" style="margin:0;text-align:center">Your morning fruit, one login away.</p>
    </div>

    <a href="index.html" style="text-align:center;font:600 14px/1 var(--sans)">← Back to Fruitly</a>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var mode = "signin";
  var tabs = { signin: document.getElementById("tab-signin"), signup: document.getElementById("tab-signup") };
  var nameField = document.getElementById("name-field");
  var submit = document.getElementById("auth-submit");
  var err = document.getElementById("auth-error");
  var pw = document.getElementById("f-password");

  function setMode(m) {
    mode = m;
    Object.keys(tabs).forEach(function (k) {
      tabs[k].classList.toggle("is-on", k === m);
      tabs[k].setAttribute("aria-selected", k === m ? "true" : "false");
    });
    nameField.hidden = m !== "signup";
    submit.textContent = m === "signup" ? "Create account" : "Sign in";
    pw.autocomplete = m === "signup" ? "new-password" : "current-password";
    err.textContent = "";
  }
  tabs.signin.addEventListener("click", function () { setMode("signin"); });
  tabs.signup.addEventListener("click", function () { setMode("signup"); });

  document.getElementById("auth-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    err.textContent = "";
    var email = document.getElementById("f-email").value.trim();
    var password = pw.value;
    var name = document.getElementById("f-name").value.trim();
    if (!email || password.length < 8) {
      err.textContent = "Enter your email and a password of 8+ characters.";
      return;
    }
    submit.disabled = true;
    submit.textContent = mode === "signup" ? "Creating…" : "Signing in…";
    try {
      if (mode === "signup") await FruitlyAPI.signUp(email, password, name);
      else await FruitlyAPI.signIn(email, password);
      var next = new URLSearchParams(location.search).get("next") || "account.html";
      if (!/^[a-z0-9-]+\.html$/.test(next)) next = "account.html";
      location.href = next;
    } catch (ex) {
      err.textContent = ex.message === "Invalid login credentials"
        ? "That email and password don’t match."
        : ex.message;
      submit.disabled = false;
      setMode(mode);
    }
  });
});
</script>

</body>
</html>
