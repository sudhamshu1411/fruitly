<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in — Fruitly</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fruitly.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/auth-callback.js" defer></script>
<style>
  .spinner {
    width: 34px; height: 34px; border-radius: 999px;
    border: 3px solid rgba(21, 122, 62, 0.18); border-top-color: var(--green);
  }
  @media (prefers-reduced-motion: no-preference) {
    .spinner { animation: spin 760ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  }
</style>
</head>
<body>

<main style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:min(420px,100%);display:flex;flex-direction:column;gap:26px;align-items:center;text-align:center">
    <a href="index.html" style="display:flex;align-items:center;gap:12px;color:var(--ink)">
      <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true"><path d="M58 7C75 12 87 31 87 51C87 73 68 92 45 92C25 92 10 78 10 59C10 46 18 37 29 28C39 20 44 3 58 7Z" fill="#157A3E"/><path d="M58 7C75 12 87 31 87 51C87 73 68 92 45 92C25 92 10 78 10 59C10 46 18 37 29 28C39 20 44 3 58 7Z" fill="#FFC233" transform="translate(23 15) scale(0.585)"/><path d="M56 9C60 2 69 0 76 3C74 11 65 15 56 9Z" fill="#A8C64D"/></svg>
      <span class="wordmark wordmark--lg">Fruitly</span>
    </a>

    <div class="spinner" id="cb-spinner" aria-hidden="true"></div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <h1 class="h3" id="cb-title">Signing you in</h1>
      <p class="muted" id="cb-message" role="status" style="margin:0;font-size:calc(15px * var(--ui))">One moment.</p>
    </div>

    <div id="cb-actions" hidden style="display:flex;flex-direction:column;gap:10px;width:100%">
      <a class="btn btn--green btn--block" href="auth.html" id="cb-primary">Back to sign in</a>
    </div>
  </div>
</main>

</body>
</html>
